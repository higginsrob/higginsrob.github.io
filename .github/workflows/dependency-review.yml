name: "Dependency Review"

on: 
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
        
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
          # Fail the action if any vulnerabilities are found
          fail-on-severity: moderate
          # Allow GPL-3.0 and MIT licenses
          allow-licenses: GPL-3.0, MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          # Deny packages with these licenses
          deny-licenses: GPL-2.0, LGPL-2.0
          # Comment on PR with summary
          comment-summary-in-pr: true
          # Retry on transient errors
          retry-on-snapshot-warnings: true